        body{
            background-color:#D9814E;

        header{
            display: grid;
             background-color: #93B7BF;
            }

         header h1{
                color:#F2F2F0 ;
                text-align: center;
                margin: 10px 0px 10px 0px;
                text-shadow: 1px 2px 3px black;
            }

            menu{
                 display: grid;
                background-color: #ebad87;
                grid-auto-flow: column;
                align-items: center;
                justify-items: center;
            }

         menu h2{ 
                margin: 10px;
                color:#8C6954;
                text-shadow: 1px 2px 3px black;
            }

            main{
                display: flex;
                flex-direction: row;
                justify-content: space-around;
                flex-wrap: wrap;
            }

            main > div {
                display: inline;
                background-color: white;
                margin: 10px;
                padding: 10px;
                box-shadow: 3px 3px 2px 0px rgba(0, 0, 0, 1);
            }
            main > div:hover{
                width: 300px;
                height: 300px;
                transition: 1.5s;
            }

            div > img{
                width: 216px;
                height: 212px;
            }

             #container > div > p{
                text-align: center;
                color:black;
            }

        h3{
                display: flex;
            }
    </style>
