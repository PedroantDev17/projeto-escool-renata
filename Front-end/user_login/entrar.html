<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/entrar.css">
    <title>Entrar</title>
</head>
<body>
    <div id="container">
        <section class="image-logo">
            <img src="../favicon/favicon-32x32.png" alt="logotipo">
        </section>
        <section class="formulario">
            <form action="#">
                <label for="iemail">Gmail:</label>
                <input type="email"
                 name="email" 
                 id="iemail" 
                 placeholder="Coloque seu Gmail">
                <label for="isenha">Senha:</label>
                <input type="password" name="senha"
                 id="isenha"
                 placeholder="Insira sua senha">
                <input type="submit" value="Entrar">
            </form>
        </section>
    </div>
</body>
</html>
