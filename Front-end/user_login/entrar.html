<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../favicon_io/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="../css/entrar.css">
    <title>Entrar</title>
    <script src="scripts/entrar.js"></script>
</head>
<body>
    <div id="container">
        <section class="image-logo" >
            <img src="../favicon_io/apple-touch-icon.png" alt="logotipo">
        </section>
        <section class="formulario">
            <form action="#" method="post"  onsubmit="return create_dados(event)">
                <label for="iemail">Gmail:</label>
                <input type="email"
                 name="email" 
                 id="iemail" 
                 placeholder="Coloque seu Gmail"
                 required
                 autocomplete="off">
                <label for="isenha">Senha:</label>
                <input type="password" name="senha"
                 id="isenha"
                 placeholder="Insira sua senha"
                 required>
                <input type="submit" value="Entrar">
            </form>
        </section>
    </div>
</body>
</html>
