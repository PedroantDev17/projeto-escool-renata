<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="favicon_io/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="css/create_user.css">
    <title>Cadastro</title>
   <script src="user_login/scripts/create_user.js"></script>
   <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="Front-end/user_login/scripts/auth.js"></script>

</head>
<body>
    <div id="container">
        <section class="image-logo">
            <img src="favicon_io/apple-touch-icon.png" alt="logotipo">
        </section>
        <section class="formulario">
            <form action="#" method="post" onsubmit="return create_dados(event)">
                <label for="iname">Nome: <span>*</span></label>
                <input type="text"
                required
                name="nome"
                id="inome"
                placeholder="Coloque seu nome">

                <label for="iemail">Gmail: <span>*</span></label>
                <input type="email"
                 name="email" 
                 id="iemail" 
                 placeholder="Coloque seu Gmail"
                 required
                 autocomplete="off">
                 
                <label for="isenha">Senha: <span>*</span></label>
                <input type="password" 
                name="senha"
                 id="isenha"
                 placeholder="Insira sua senha"
                 required>
                <input type="submit" value="Entrar">
            </form>
        </section>
        <h2>ou</h2>
        <div id="g_id_onload"
                    data-client_id="548186241483-5krrrq1vucj71a00a6pp9tqoo1gkpt07.apps.googleusercontent.com"
                    data-callback="handleGoogleLogin">
                </div>
                <div class="g_id_signin" data-type="standard"></div>
    </div>
</body>
</html>
