<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Vercel Speed Insights -->
    <script>
      window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/speed-insights/script.js"></script>
    <link rel="shortcut icon" href="favicon_io/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="css/entrar.css">
    <title>Entrar</title>
    <script src="user_login/scripts/entrar.js"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
    <div id="container">
        <section class="image-logo" >
            <img src="favicon_io/apple-touch-icon.png" alt="logotipo">
        </section>
        <section class="formulario">
            <form>
                <label for="iemail">Gmail:</label>
                <input type="email"
                 name="email" 
                 id="iemail" 
                 placeholder="Coloque seu Gmail"
                 required
                 autocomplete="off">
                <label for="isenha">Senha:</label>
                <input type="password" name="senha"
                 id="isenha"
                 placeholder="Insira sua senha"
                 autocomplete="current-password"
                 required>
                <input type="submit" value="Entrar" onclick="entrar(event)">
                
            </form>
        </section>
        <h2>ou</h2>
        <div id="g_id_onload"
                    data-client_id="548186241483-5krrrq1vucj71a00a6pp9tqoo1gkpt07.apps.googleusercontent.com"
                    data-callback="handleGoogleLogin">
                </div>
                <div class="g_id_signin" data-type="standard"></div>
                 <p id="contagem-login" style="color: red; display: none;"></p>
    </div>
</body>
</html>
