    <script>
       // Executa uma função repetidamente a cada 1000 milissegundos (1 segundo)
setInterval(function() {
    // Gera números aleatórios entre 0 e 255 para o padrão RGB
    const r = Math.floor(Math.random() * 256);
    const g = Math.floor(Math.random() * 256);
    const b = Math.floor(Math.random() * 256);

    // Aplica a cor gerada no fundo do corpo (body) da página
    document.body.style.backgroundColor = `rgb(${r}, ${g}, ${b})`;
}, 100);


    </script>
